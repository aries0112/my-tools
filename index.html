<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期時間轉換工具 - 玥視界</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f2f2f7;
    padding: 20px;
    color: #1c1c1e;
    line-height: 1.5;
  }
  .container {
    max-width: 500px;
    margin: 0 auto;
    padding-bottom: 40px;
  }
  header { text-align: center; margin-bottom: 24px; }
  h1 { font-size: 24px; color: #007aff; margin-bottom: 8px; }
  .intro { font-size: 14px; color: #8e8e93; }
  
  .card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  h2 { font-size: 17px; margin-bottom: 12px; font-weight: 600; }
  textarea {
    width: 100%;
    border: 1.5px solid #e5e5ea;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 12px;
    resize: none;
    outline: none;
    background: #fafafa;
  }
  textarea:focus { border-color: #007aff; background: #fff; }
  
  .primary-btn {
    width: 100%;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .primary-btn:active { background: #0056b3; }

  .result-section { margin-top: 24px; }
  .result-display {
    background: #f2f2f7;
    border-radius: 12px;
    padding: 16px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed #d1d1d6;
  }
  .copy-btn {
    width: 100%;
    background: #34c759;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    margin-top: 12px;
    cursor: pointer;
    display: none;
  }

  .instructions { font-size: 14px; color: #3a3a3c; }
  .instructions h3 { font-size: 15px; margin-bottom: 8px; color: #1c1c1e; }
  .instructions ul { list-style: none; margin-bottom: 15px; }
  .instructions li { margin-bottom: 6px; padding-left: 18px; position: relative; }
  .instructions li::before { content: "•"; position: absolute; left: 0; color: #007aff; }
  .tip { font-size: 13px; color: #8e8e93; font-style: italic; }

  footer {
    text-align: center;
    font-size: 11px;
    color: #aeaeb2;
    margin-top: 30px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📅 日期時間轉換工具</h1>
    <p class="intro">支援 iPhone 相片與 Gmail 郵件格式轉換</p>
  </header>

  <div class="card">
    <h2>輸入日期時間</h2>
    <textarea id="userInput" rows="3" placeholder="例如：2026年3月28日 星期六 20:06 或 2014年1月9日 凌晨12:53"></textarea>
    <button class="primary-btn" onclick="convert()">轉換格式</button>

    <div class="result-section">
      <div class="result-display" id="output">等待輸入...</div>
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">複製結果</button>
    </div>
  </div>

  <div class="card instructions">
    <h3>📖 使用說明</h3>
    <ul>
      <li><strong>iPhone 相片：</strong>直接從相片 App 複製日期文字貼上，支援帶有「星期」的格式。</li>
      <li><strong>Gmail 郵件：</strong>支援自動辨識「凌晨、早上、上午、下午、晚上」。</li>
      <li><strong>輸出標準：</strong>符合 TeraBox 自動命名規則 (YYYY-MM-DD HHmm)。</li>
    </ul>
    <p class="tip">提示：輸入後按 Enter 鍵可快速轉換，點擊複製按鈕可直接存入剪貼簿。</p>
  </div>

  <footer>
    吉米製作 &nbsp; | &nbsp; 玥視界 🄫 2026
  </footer>
</div>

<script>
// 支援 Enter 鍵轉換
document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        convert();
    }
});

function convert() {
  const input = document.getElementById('userInput').value.trim();
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');

  const regex = /(\d{4})年(\d{1,2})月(\d{1,2})日\s*.*?(凌晨|早上|上午|下午|晚上)?\s*(\d{1,2}):(\d{2})/;
  const match = input.match(regex);

  if (match) {
    const y = match[1];
    const m = match[2].padStart(2, '0');
    const d = match[3].padStart(2, '0');
    const period = match[4] || '';
    let h = parseInt(match[5]);
    const min = match[6];

    if (period === '下午' || period === '晚上') {
      if (h < 12) h += 12;
    } else {
      if (h === 12) h = 0; 
    }

    const result = `${y}-${m}-${d} ${String(h).padStart(2, '0')}${min}`;
    output.textContent = result;
    output.style.color = "#1c1c1e";
    copyBtn.style.display = 'block';
  } else {
    output.textContent = '格式辨識失敗，請檢查輸入內容';
    output.style.color = "#ff3b30";
    copyBtn.style.display = 'none';
  }
}

function copyResult() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    const originalText = btn.textContent;
    btn.textContent = '✅ 已複製到剪貼簿';
    btn.style.background = '#1c1c1e';
    setTimeout(() => { 
      btn.textContent = originalText; 
      btn.style.background = '#34c759';
    }, 1500);
  });
}
</script>

</body>
</html>
