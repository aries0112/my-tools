<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日期時間轉換工具 v2.2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f2f2f7;
    padding: 30px 20px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  h2 { font-size: 18px; margin-bottom: 16px; color: #007aff; text-align: center; }
  textarea {
    width: 100%;
    border: 1.5px solid #e5e5ea;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 12px;
    resize: none;
    outline: none;
  }
  textarea:focus { border-color: #007aff; }
  button {
    width: 100%;
    background: #007aff;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .result-box {
    margin-top: 20px;
    background: #f2f2f7;
    border-radius: 12px;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #output { font-size: 20px; font-weight: 700; color: #1c1c1e; letter-spacing: 0.5px; }
  .copy-btn {
    background: #34c759;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <h2>日期時間快速轉換</h2>
  <textarea id="userInput" rows="3" placeholder="貼上 iPhone 相片或 Gmail 日期..."></textarea>
  <button onclick="convert()">轉換格式</button>
  
  <div class="result-box">
    <span id="output">—</span>
    <button class="copy-btn" id="copyBtn" style="display:none" onclick="copyResult()">複製</button>
  </div>
  
  <div style="margin-top: 15px; font-size: 12px; color: #8e8e93; line-height: 1.6;">
    • 自動辨識：凌晨、早上、上午、下午、晚上<br>
    • 符合 TeraBox 命名規則 (YYYY-MM-DD HHmm)
  </div>
</div>

<script>
function convert() {
  const input = document.getElementById('userInput').value.trim();
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');

  // Regex 修正：廣泛捕捉所有中文字詞
  const regex = /(\d{4})年(\d{1,2})月(\d{1,2})日\s*.*?(凌晨|早上|上午|下午|晚上)?\s*(\d{1,2}):(\d{2})/;
  const match = input.match(regex);

  if (match) {
    const y = match[1];
    const m = match[2].padStart(2, '0');
    const d = match[3].padStart(2, '0');
    const period = match[4] || '';
    let h = parseInt(match[5]);
    const min = match[6];

    // 24小時制邏輯
    if (period === '下午' || period === '晚上') {
      if (h < 12) h += 12; // 下午 1:00 -> 13:00
    } else {
      // 凌晨、早上、上午 狀況
      if (h === 12) h = 0; // 凌晨 12:00 -> 00:00
    }

    const result = `${y}-${m}-${d} ${String(h).padStart(2, '0')}${min}`;
    output.textContent = result;
    copyBtn.style.display = 'block';
  } else {
    output.textContent = '辨識失敗';
    copyBtn.style.display = 'none';
  }
}

function copyResult() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已複製';
    btn.style.background = '#1c1c1e';
    setTimeout(() => { 
      btn.textContent = '複製'; 
      btn.style.background = '#34c759';
    }, 1000);
  });
}
</script>

</body>
</html>
